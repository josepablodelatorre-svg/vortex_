<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    cursor: crosshair;
  }
  canvas {
    display: block;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #a855ff;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1.5;
    text-shadow: 0 0 8px #a855ff;
    pointer-events: none;
    user-select: none;
    background: rgba(10, 0, 24, 0.5);
    border: 1px solid rgba(168, 85, 255, 0.35);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 220px;
  }
  #hudtop {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  #hudkills {
    opacity: 0.8;
    font-size: 10px;
  }
  #hudrun {
    display: none;
    font-size: 10px;
    color: #ff5533;
    text-shadow: 0 0 6px #ff5533;
  }
  #hudtriple {
    display: none;
    font-size: 10px;
    color: #fff6c8;
    text-shadow: 0 0 6px #ffffff;
  }
  #hudbars {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(168, 85, 255, 0.25);
  }
  .hudrow {
    display: grid;
    grid-template-columns: 40px 1fr;
    align-items: center;
    gap: 8px;
  }
  #bossrow {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #bossbar {
    flex: 1;
    width: auto;
    height: 10px;
    border: 1px solid #ff5533;
    box-shadow: 0 0 10px rgba(255,85,51,0.7);
    padding: 2px;
  }
  #bossfill {
    height: 100%;
    width: 100%;
    background: #ff5533;
    transition: width 0.2s linear;
  }
  #levelbanner {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #3c8aff;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 20px;
    letter-spacing: 4px;
    text-shadow: 0 0 18px #3c8aff;
    pointer-events: none;
    user-select: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #hullbar {
    flex: 1;
    width: auto;
    height: 10px;
    border: 1px solid #a855ff;
    box-shadow: 0 0 8px rgba(168,85,255,0.6);
    padding: 2px;
  }
  #hullfill {
    height: 100%;
    width: 100%;
    background: #3f6;
    transition: width 0.2s linear, background 0.2s linear;
  }
  #damageflash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,30,30,0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s linear;
  }
  /* Retro CRT overlay: scanlines + vignette + a faint flicker, pure CSS so
     it costs nothing extra to render and needs no WebGL/shader pipeline.
     Sits above everything (canvas, HUD, menus) and never blocks clicks. */
  #crtOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #crtOverlay.on { opacity: 1; }
  #crtScanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.0) 0px,
      rgba(0,0,0,0.0) 1px,
      rgba(0,0,0,0.22) 2px,
      rgba(0,0,0,0.22) 3px
    );
    mix-blend-mode: multiply;
    animation: crtFlicker 0.12s infinite;
  }
  #crtVignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
  @keyframes crtFlicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.94; }
  }
  #crtToggle {
    margin-top: 14px;
    background: transparent;
    border: 1px solid #3c8aff;
    color: #3c8aff;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 8px 12px;
    cursor: pointer;
    text-shadow: 0 0 6px #3c8aff;
  }
  #crtToggle.selected {
    background: #3c8aff;
    color: #000;
    text-shadow: none;
    box-shadow: 0 0 14px #3c8aff;
  }
  #titlebrand {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0.75;
  }
  #titlebrand img {
    height: 46px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 6px rgba(63,255,102,0.65));
  }
  #titlebrand span {
    color: #3f6;
    font-size: 9px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px #3f6;
  }
  #title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #3c8aff;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    text-align: center;
    text-shadow: 0 0 16px #3c8aff;
    user-select: none;
    cursor: pointer;
  }
  #title h1 {
    font-size: 40px;
    letter-spacing: 8px;
    margin: 0;
  }
  #title p {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.7;
    margin-top: 20px;
  }
  /* flickering, glitchy bitmap-terminal title characters */
  .flicker-char {
    display: inline-block;
    animation-name: charFlicker;
    animation-iteration-count: infinite;
    animation-timing-function: steps(1);
  }
  @keyframes charFlicker {
    0%, 90% { opacity: 1; }
    91% { opacity: 0.15; }
    92% { opacity: 1; }
    94% { opacity: 0.25; }
    95% { opacity: 1; }
    100% { opacity: 1; }
  }
  .flicker-char.underscore {
    animation-name: cursorBlink;
    animation-duration: 1s;
  }
  @keyframes cursorBlink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  #gameover {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f0f;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    text-align: center;
    text-shadow: 0 0 16px #f0f;
    user-select: none;
    display: none;
  }
  #gameover h1 {
    font-size: 26px;
    letter-spacing: 4px;
    margin: 0;
  }
  #gameover p {
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 18px;
    opacity: 0.8;
  }
  #cleared {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #3f6;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    text-align: center;
    text-shadow: 0 0 16px #3f6;
    user-select: none;
    display: none;
  }
  #cleared h1 {
    font-size: 26px;
    letter-spacing: 4px;
    margin: 0;
  }
  #cleared p {
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 18px;
    opacity: 0.8;
  }
  #difficulty {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  #difficulty button {
    background: transparent;
    border: 1px solid #3c8aff;
    color: #3c8aff;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 10px 14px;
    cursor: pointer;
    text-shadow: 0 0 6px #3c8aff;
  }
  #difficulty button.selected {
    background: #3c8aff;
    color: #000;
    text-shadow: none;
    box-shadow: 0 0 14px #3c8aff;
  }
  #besttag {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0.75;
    margin: 6px 0 0;
  }
  #shipcolor {
    margin-top: 18px;
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
  }
  #shipcolor .scLabel {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 1px;
    opacity: 0.6;
    margin-right: 4px;
  }
  #shipcolor button {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid currentColor;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  #shipcolor button.selected {
    box-shadow: 0 0 10px currentColor;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="damageflash"></div>
<div id="crtOverlay"><div id="crtScanlines"></div><div id="crtVignette"></div></div>
<div id="levelbanner"></div>
<div id="hud">
  <div id="hudtop">
    <span>LVL <span id="levelnum">1</span></span>
    <span>SCORE <span id="score">0</span></span>
  </div>
  <div id="hudkills">KILLS <span id="kills">0</span>/<span id="killTarget">20</span></div>
  <div id="hudrun"></div>
  <div id="hudtriple"></div>
  <div id="hudbars">
    <div id="hullrow" class="hudrow">HULL<div id="hullbar"><div id="hullfill"></div></div></div>
    <div id="bossrow" class="hudrow">BOSS<div id="bossbar"><div id="bossfill"></div></div></div>
  </div>
</div>
<div id="title">
  <h1>VORTEX</h1>
  <p id="besttag"></p>
  <div id="difficulty">
    <button data-diff="easy">EASY</button>
    <button data-diff="normal" class="selected">NORMAL</button>
    <button data-diff="hard">HARD</button>
  </div>
  <button id="crtToggle" class="selected">CRT: ON</button>
  <div id="shipcolor">
    <span class="scLabel">SHIP</span>
    <button data-palette="0" class="selected"></button>
    <button data-palette="1"></button>
    <button data-palette="2"></button>
    <button data-palette="3"></button>

<script>
// Build the title out of individually flickering characters, bookended by
// blinking terminal-style underscores, like an old CRT losing sync.
(function buildFlickerTitle() {
  const h1 = document.querySelector('#title h1');
  const text = h1.textContent.trim();
  h1.innerHTML = '';
  const makeSpan = (ch, extraClass) => {
    const span = document.createElement('span');
    span.className = 'flicker-char' + (extraClass ? ' ' + extraClass : '');
    span.textContent = ch;
    span.style.animationDuration = (1.6 + Math.random() * 2.2).toFixed(2) + 's';
    span.style.animationDelay = (Math.random() * 2).toFixed(2) + 's';
    return span;
  };
  h1.appendChild(makeSpan('_', 'underscore'));
  for (const ch of text) h1.appendChild(makeSpan(ch));
  h1.appendChild(makeSpan('_', 'underscore'));
})();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio ----------
let actx = null;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  initMusicAnalyser();
}

// ---------- Music (background soundtrack, separate from the WebAudio SFX) ----------
// Mastered to -9 LUFS / -1 dBTP so they sit at commercial loudness alongside
// the procedural sound effects instead of sounding thin next to them.
const musicGarden = new Audio('audio/garden.m4a');       // calm, title/results theme
const musicDestruction = new Audio('audio/destruction.m4a'); // aggressive, gameplay theme
musicGarden.loop = true;
musicDestruction.loop = true;
musicGarden.preload = 'auto';
musicDestruction.preload = 'auto';
musicGarden.volume = 0;
musicDestruction.volume = 0;
const MUSIC_VOLUME = 0.55;
let musicStarted = false;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  musicGarden.play().catch(() => {});
  musicDestruction.play().catch(() => {});
}

// ---------- Music analysis (lets the tunnel breathe with the soundtrack) ----------
// The soundtrack is ambient: the low end is a near-constant drone with no
// real kick to lock onto, so instead of beat detection this follows the
// music's slow swells (mid band) and its brighter shimmering layers (high
// band). Each band is normalised against its own adaptive floor/ceiling, so
// the visuals track the track's dynamics rather than its absolute loudness.
// Only when served over http(s): on file:// the browser treats the audio
// files as cross-origin and a MediaElementSource would output pure silence,
// muting the music. There musicSwell/musicShimmer just stay 0 and every
// visual that reads them looks exactly like it did before.
let musicAnalyser = null;
let musicFreq = null;
let musicSwell = 0;    // 0..1, slow: how "open"/full the music is right now
let musicShimmer = 0;  // 0..1, quicker: bright high-end texture
let swellRings = [];   // { startTime } rings drifting in from the far wall
let swellRingTimer = 0;
const SWELL_RING_SPEED = 0.5; // z units per second: a slow, ambient drift
const musicBands = {
  mid: { lo: 0, hi: 0, primed: false },
  high: { lo: 0, hi: 0, primed: false }
};

function initMusicAnalyser() {
  if (musicAnalyser || !actx) return;
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const analyser = actx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.8;
    // connect to the speakers first, so a failure part-way through can't
    // leave a track routed into a dead end
    analyser.connect(actx.destination);
    actx.createMediaElementSource(musicGarden).connect(analyser);
    actx.createMediaElementSource(musicDestruction).connect(analyser);
    musicAnalyser = analyser;
    musicFreq = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) {
    musicAnalyser = null;
  }
}

function bandAverage(from, to) {
  let sum = 0;
  for (let k = from; k < to; k++) sum += musicFreq[k];
  return sum / ((to - from) * 255);
}

// Maps a raw band level to 0..1 within the range it has recently covered:
// the floor/ceiling snap outward quickly and relax back inward slowly.
function normaliseBand(band, x, dt) {
  if (!band.primed) { band.lo = x; band.hi = x + 0.1; band.primed = true; }
  band.lo = x < band.lo ? x : band.lo + (x - band.lo) * Math.min(1, dt * 0.05);
  band.hi = x > band.hi ? x : band.hi + (x - band.hi) * Math.min(1, dt * 0.05);
  return Math.max(0, Math.min(1, (x - band.lo) / Math.max(0.12, band.hi - band.lo)));
}

function updateMusicMood(dt) {
  if (!musicAnalyser) return;
  musicAnalyser.getByteFrequencyData(musicFreq);
  // bins at ~47Hz each: 6..60 = ~280Hz-2.8kHz pads/chords, 60..250 = air/shimmer
  const mid = normaliseBand(musicBands.mid, bandAverage(6, 60), dt);
  const high = normaliseBand(musicBands.high, bandAverage(60, 250), dt);
  musicSwell += (mid - musicSwell) * Math.min(1, dt * 1.2);
  musicShimmer += (high - musicShimmer) * Math.min(1, dt * 4);

  // the fuller the music, the more often a soft ring drifts in from the
  // event horizon: a slow tide in quiet passages, a steady flow at peaks
  if (state === 'playing') {
    swellRingTimer -= dt;
    if (swellRingTimer <= 0) {
      if (musicSwell > 0.2 && swellRings.length < 6) swellRings.push({ startTime: t });
      swellRingTimer = 2.6 - 1.9 * musicSwell;
    }
  }
}

// Crossfades both tracks' volume toward whichever one should be active,
// so switching between title/results and gameplay feels like one mix
// instead of a hard cut.
let musicFadeHandle = null;
function setMusicTrack(active) {
  startMusic();
  const targetGarden = active === 'garden' ? MUSIC_VOLUME : 0;
  const targetDestruction = active === 'destruction' ? MUSIC_VOLUME : 0;
  if (musicFadeHandle) clearInterval(musicFadeHandle);
  musicFadeHandle = setInterval(() => {
    const step = 0.035;
    let done = true;
    if (Math.abs(musicGarden.volume - targetGarden) > step) {
      musicGarden.volume += Math.sign(targetGarden - musicGarden.volume) * step;
      done = false;
    } else musicGarden.volume = targetGarden;
    if (Math.abs(musicDestruction.volume - targetDestruction) > step) {
      musicDestruction.volume += Math.sign(targetDestruction - musicDestruction.volume) * step;
      done = false;
    } else musicDestruction.volume = targetDestruction;
    if (done) clearInterval(musicFadeHandle);
  }, 50);
}

function playBass(freq = 80, dur = 0.25) {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, actx.currentTime + dur);
  gain.gain.setValueAtTime(0.4, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + dur);
}

function playZap() {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(900, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(120, actx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.25, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.12);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.12);
}

function playHit() {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(220, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, actx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.3, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.2);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.2);
}

function playDamage() {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(140, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.35);
  gain.gain.setValueAtTime(0.35, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.35);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.35);
}

function playPowerUp() {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(440, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(880, actx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.3, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.25);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.25);
}

function playEnemyShot() {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(500, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(220, actx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.2, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.18);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.18);
}

function playBossHit() {
  if (!actx) return;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(160, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, actx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.35, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + 0.3);
}

// ---------- Game State ----------
let state = 'title'; // title | playing | gameover | cleared
let score = 0;
let killCount = 0;
let t = 0;

// Hull integrity: the ship takes damage from enemy contact rather than
// dying outright, SIGNAL LOST only fires once hull hits zero.
const HULL_MAX = 100;
const HULL_DAMAGE_PER_HIT = 16;
const HULL_REPAIR_PER_POWERUP = 32;
let hull = HULL_MAX;
let damageFlash = 0; // 0..1, decays each frame

function updateHullUI() {
  const pct = Math.max(0, hull) / HULL_MAX * 100;
  const fill = document.getElementById('hullfill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? '#3f6' : pct > 25 ? '#ffcc33' : '#f33';
}

// Shared damage path for anything that hurts the ship: enemy contact,
// enemy bolts, boss contact. Keeps the flash/sound/lose-check in one place.
function damageShip(amount) {
  hull -= amount;
  updateHullUI();
  playDamage();
  damageFlash = 1;
  triggerShake(amount >= 20 ? 14 : 8, 0.3);
  if (hull <= 0) {
    hull = 0;
    updateHullUI();
    endGame();
  }
}

// Objective: destroy this many regular enemies WITHIN THE CURRENT LEVEL to
// summon that level's boss. killCount resets to 0 at the start of each
// level, so this is a per-level target, not a run-total one.
const KILL_TARGET = 20;

// Two quick miniboss detours happen along the way to each level's full kill
// count, at these local (per-level) kill counts. Beating a miniboss doesn't
// advance the level or reset progress — it's a side fight, not a gate.
const MINIBOSS_THRESHOLDS = [7, 13];
let nextMinibossIndex = 0; // resets to 0 each level, alongside killCount

// The run is split into levels, each unlocking tougher enemy variety and
// ending in its own boss fight once that level's kill target is reached.
const LEVEL_COUNT = 3;
let currentLevel = 1;
let levelBannerTimer = 0;

function showLevelBanner(text) {
  const el = document.getElementById('levelbanner');
  el.textContent = text;
  el.style.opacity = '1';
  levelBannerTimer = 2.0;
}

// Boss: each level's full kill count ends in that level's boss fight; two
// quicker minibosses punctuate the way there. All take several hits and
// deal heavy contact damage without ending the fight on contact. Later
// levels (and New-Game-Plus runs) field a tougher boss.
const BOSS_HP_BASE = 5;
const BOSS_HP_PER_LEVEL = 3;
const MINIBOSS_HP = 3; // flat and quick — a detour, not the main event
const BOSS_CONTACT_DAMAGE = 22;
const BOSS_RESET_Z = 0.55;
let bossActive = false;
let boss = null; // { angle, z, hp, hpMax, fireTimer, alive, kind: 'mini'|'level'|'final' }

function updateBossUI() {
  const row = document.getElementById('bossrow');
  if (!boss) { row.style.opacity = '0'; return; }
  row.style.opacity = '1';
  const pct = Math.max(0, boss.hp) / boss.hpMax * 100;
  document.getElementById('bossfill').style.width = pct + '%';
}

function spawnBoss(kind) {
  const hpMax = kind === 'mini'
    ? MINIBOSS_HP + runTier
    : BOSS_HP_BASE + (currentLevel - 1) * BOSS_HP_PER_LEVEL + runTier * 2;
  boss = { angle: 0, z: 1.0, hp: hpMax, hpMax, fireTimer: 2.0, alive: true, kind };
  bossActive = true;
  updateBossUI();
}

// New-Game-Plus escalation: beating the boss doesn't just reset to Level 1,
// it bumps this and the next run comes back meaner. Resets to 0 on a fresh
// start or a loss, so dying doesn't carry the escalation forward.
let runTier = 0;

// Difficulty presets, chosen on the title screen before a run starts.
let difficultySetting = 'normal';
const DIFFICULTY_PARAMS = {
  easy:   { spawnBase: 2.6, spawnMin: 1.2, spawnDecay: 0.004, speedBase: 0.055, speedVar: 0.02,  rampRate: 0.008 },
  normal: { spawnBase: 2.0, spawnMin: 0.8, spawnDecay: 0.006, speedBase: 0.07,  speedVar: 0.03,  rampRate: 0.012 },
  hard:   { spawnBase: 1.3, spawnMin: 0.45,spawnDecay: 0.01,  speedBase: 0.09,  speedVar: 0.045, rampRate: 0.02 },
};

// Scales the chosen difficulty preset up by the current run tier, so each
// New-Game-Plus continuation after a win spawns faster/denser/quicker than
// the last, without a separate full preset table to maintain.
function getDiffParams() {
  const base = DIFFICULTY_PARAMS[difficultySetting];
  const spawnMul = Math.max(0.5, 1 - runTier * 0.08);
  const speedMul = 1 + runTier * 0.12;
  const rampMul = 1 + runTier * 0.15;
  return {
    spawnBase: base.spawnBase * spawnMul,
    spawnMin: base.spawnMin * spawnMul,
    spawnDecay: base.spawnDecay,
    speedBase: base.speedBase * speedMul,
    speedVar: base.speedVar * speedMul,
    rampRate: base.rampRate * rampMul
  };
}

// Aim angle around the tunnel ring (0 = up, clockwise)
let aimAngle = 0;

// Tunnel rings: each ring has a z depth (distance from camera), rings recede as z decreases... 
// we'll model it as z going from FAR to 0 (player), wrapping back to FAR.
const RING_COUNT = 14;
const RING_SPACING = 1.0 / RING_COUNT;
let rings = [];
for (let i = 0; i < RING_COUNT; i++) {
  rings.push({ z: i / RING_COUNT });
}
const TUNNEL_SPEED = 0.2; // z units per second (base; ramps up over time, see effectiveTunnelSpeed)

const SIDES = 9; // fixed count for the background radial guide spokes
const RING_SAMPLES = 36; // sample density for the tunnel's cross-section outline

// The tunnel's cross-section shape itself slowly morphs as you advance: each
// level (and each New-Game-Plus run after a win) steps to the next shape in
// this list, looping back around once it reaches "circle". tunnelSides eases
// toward tunnelSidesTarget over several seconds rather than snapping.
const SHAPE_STAGES = [9, 8, 7, 6, 5, 4, 3, 42];
function computeShapeStage() {
  const stage = (runTier * LEVEL_COUNT + (currentLevel - 1)) % SHAPE_STAGES.length;
  return SHAPE_STAGES[stage];
}
let tunnelSides = 9;
let tunnelSidesTarget = 9;

// How far ahead (in virtual seconds) the camera path "sees" at the far wall.
// Higher = more dramatic banking through turns, like a pipe or trench run.
// Kept shorter than the straight segment durations below so there's real
// dead-straight tunnel to fly through, not a constant preview of the next bend.
const PATH_LOOKAHEAD = 2.4;

function effectiveTunnelSpeed() {
  // being sucked toward the event horizon: speed creeps up over the run
  return TUNNEL_SPEED * (1 + Math.min(t * 0.012, 1.8));
}

// The camera's path through the tunnel alternates straight runs (no drift) with
// banked curves (smooth turn to a new heading), like a pipe with real straightaways.
// Each curve's dx/dy sums to zero across the cycle so the loop closes cleanly.
const PATH_SEGMENTS_DEF = [
  { type: 'straight', dur: 6.5 },
  { type: 'curve',    dur: 4.0, dx: 1.0,  dy: 0.3 },
  { type: 'straight', dur: 7.0 },
  { type: 'curve',    dur: 4.0, dx: -0.6, dy: -0.9 },
  { type: 'straight', dur: 5.5 },
  { type: 'curve',    dur: 4.0, dx: 0.9,  dy: 0.4 },
  { type: 'straight', dur: 6.0 },
  { type: 'curve',    dur: 4.0, dx: -1.3, dy: 0.2 },
];
const PATH_SEGMENTS = (() => {
  let cumT = 0, curX = 0, curY = 0;
  return PATH_SEGMENTS_DEF.map(s => {
    const startT = cumT, endT = cumT + s.dur;
    const toX = s.type === 'curve' ? curX + s.dx : curX;
    const toY = s.type === 'curve' ? curY + s.dy : curY;
    const seg = { type: s.type, startT, endT, fromX: curX, fromY: curY, toX, toY };
    curX = toX; curY = toY; cumT = endT;
    return seg;
  });
})();
const PATH_CYCLE = PATH_SEGMENTS[PATH_SEGMENTS.length - 1].endT;

function smoothstep01(x) {
  x = Math.max(0, Math.min(1, x));
  return x * x * (3 - 2 * x);
}

function pathOffsetUnits(vt) {
  let lt = vt % PATH_CYCLE;
  if (lt < 0) lt += PATH_CYCLE;
  for (const seg of PATH_SEGMENTS) {
    if (lt >= seg.startT && lt < seg.endT) {
      if (seg.type === 'straight') return { x: seg.fromX, y: seg.fromY };
      const frac = smoothstep01((lt - seg.startT) / (seg.endT - seg.startT));
      return {
        x: seg.fromX + (seg.toX - seg.fromX) * frac,
        y: seg.fromY + (seg.toY - seg.fromY) * frac
      };
    }
  }
  return { x: 0, y: 0 };
}

function pathX(vt) {
  return pathOffsetUnits(vt).x * Math.min(W, H) * 0.42;
}
function pathY(vt) {
  return pathOffsetUnits(vt).y * Math.min(W, H) * 0.3;
}

let camRoll = 0; // banking angle, derived from lateral path velocity
let prevPathXAtT = 0;

// Pulses: expanding rings triggered by firing, brighten things near their z/time
let pulses = []; // { startTime, }

// Bolts fired by the player, travel from z=0 outward to z=1
let bolts = []; // { angle, z }

// Enemies: emerge from tunnel wall at some z, drift toward player.
// type: 'drone' (basic, straight in), 'weaver' (oscillates side to side),
// 'shooter' (slower, fires enemyBolts at the ship), 'grid' (classic marching
// formation wave, moves in lockstep with the rest of its formation)
let enemies = []; // { angle, z, shape, type, speed, alive, baseAngle, phase, fireTimer?, formSeed? }
let spawnTimer = 0;
let clusterTimer = 0;
let formationTimer = 0;
let difficulty = 1;

// Enemy bolts fired by 'shooter' enemies and the boss, travel inward (z -> 0)
let enemyBolts = []; // { angle, z }

// Power-ups: gold triangles (hull repair) or rarer white stars (triple
// laser) drifting down the tunnel, grabbed by shooting or reaching them.
// Not hostile, missing one costs nothing.
let powerups = []; // { angle, z, alive, kind: 'hull' | 'star' }
let powerupTimer = 0;
let tripleLaserTimer = 0; // seconds remaining on an active triple-laser pickup

// Particles for hit bursts
let particles = []; // { x, y, vx, vy, life }

// Flickering 0/1 bit characters that scatter when an enemy is destroyed
let bitBursts = []; // { x, y, vx, vy, life, maxLife, char }

// "HIT!" callouts that pop up and fade at the kill location
let hitLabels = []; // { x, y, vy, life, maxLife }

function project(angle, z) {
  // z in [0,1], 0 = at camera (large), 1 = far away (small, center)
  const depth = Math.max(z, 0.02);
  const scale = 1 / depth;
  const radius = Math.min(W, H) * 0.42 * (scale / (1/0.02)) * (1/0.02) ; // placeholder, replaced below
  return null;
}

// Proper projection: perspective-ish falloff
function ringRadius(z) {
  // z: 0 (close to player, big) -> 1 (far, near vanishing point)
  // near ring reaches past the corners so the tunnel fills the whole screen
  const minR = 6;
  const maxR = Math.sqrt(W * W + H * H) / 2 * 1.08;
  const tt = 1 - z; // 0 at far, 1 at close
  return minR + (maxR - minR) * Math.pow(tt, 1.25);
}

// Vortex swirl: the tunnel geometry itself slowly twists, faster with depth and
// faster as the run goes on, like being pulled toward an event horizon.
function swirlAngle(z) {
  // zero at z=0 so the near wall (and the player's aim) never drifts,
  // growing with depth and with run time so the far tunnel spirals harder
  return z * 0.9 * Math.min(1 + t * 0.015, 2.2);
}

// Regular-polygon polar equation: how much to scale a point's radius, given
// its angle around the ring, so instead of a circle you get a straight-edged
// N-sided shape. Works for fractional N too (an in-between "almost-N-gon"
// blob), which is what makes tunnelSides easing toward its target look like
// a smooth morph between shapes rather than a hard cut.
function polygonRadiusFactor(angle, sides) {
  const seg = (Math.PI * 2) / sides;
  let a = ((angle % seg) + seg) % seg;
  a -= seg / 2;
  return Math.cos(seg / 2) / Math.cos(a);
}

function pointOnRing(angle, z, opts) {
  const visual = !opts || opts.visual !== false;
  const swirl = visual ? swirlAngle(z) : 0;
  const r = ringRadius(z) * polygonRadiusFactor(angle + swirl, tunnelSides);
  // camera path bend: distant geometry shows where the path is heading,
  // near geometry (z=0) always resolves to zero offset, same as the player
  const dx = visual ? (pathX(t + z * PATH_LOOKAHEAD) - pathX(t)) : 0;
  const dy = visual ? (pathY(t + z * PATH_LOOKAHEAD) - pathY(t)) : 0;
  const a = angle + swirl - Math.PI / 2;
  return {
    x: CX + Math.cos(a) * r + dx * z,
    y: CY + Math.sin(a) * r + dy * z,
    r
  };
}

// ---------- Input ----------
let pointerX = CX, pointerY = CY - 1;

function updateAimFromPointer(x, y) {
  const dx = x - CX;
  const dy = y - CY;
  aimAngle = Math.atan2(dx, -dy); // 0 = up
}

canvas.addEventListener('mousemove', (e) => {
  pointerX = e.clientX;
  pointerY = e.clientY;
  updateAimFromPointer(pointerX, pointerY);
});

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  pointerX = touch.clientX;
  pointerY = touch.clientY;
  updateAimFromPointer(pointerX, pointerY);
}, { passive: false });

function fire() {
  if (state !== 'playing') return;
  if (tripleLaserTimer > 0) {
    for (const off of [-0.16, 0, 0.16]) {
      bolts.push({ angle: normalizeAngle(aimAngle + off), z: 0.04 });
    }
  } else {
    bolts.push({ angle: aimAngle, z: 0.04 });
  }
  pulses.push({ startTime: t, angle: aimAngle });
  playZap();
  playBass(70 + Math.random() * 20, 0.2);
}

canvas.addEventListener('mousedown', (e) => {
  initAudio();
  // a click landing on the canvas itself (rather than the centered overlay
  // text) still needs to carry the "continuing" flag, or winning and then
  // clicking slightly off-center would silently drop the harder next run
  if (state === 'title' || state === 'gameover' || state === 'cleared') { startGame(state === 'cleared'); return; }
  fire();
});

canvas.addEventListener('touchstart', (e) => {
  initAudio();
  const touch = e.touches[0];
  pointerX = touch.clientX;
  pointerY = touch.clientY;
  updateAimFromPointer(pointerX, pointerY);
  if (state === 'title' || state === 'gameover' || state === 'cleared') { startGame(state === 'cleared'); return; }
  fire();
}, { passive: false });

document.getElementById('title').addEventListener('click', () => { initAudio(); startGame(false); });
document.getElementById('gameover').addEventListener('click', () => { initAudio(); startGame(false); });
document.getElementById('cleared').addEventListener('click', () => { initAudio(); startGame(true); });

document.querySelectorAll('#difficulty button').forEach(btn => {

});

// ---------- Ship accent color (purely cosmetic, picked on the title screen) ----------
// Each palette: `main` is the hull line color, `glow` is the shadow/engine
// accent color drawShip() and the swatch buttons both key off of.
const SHIP_PALETTES = [

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${a})`;
}

try {

  if (savedScore !== null) bestScore = parseInt(savedScore, 10) || 0;

  if (savedRun !== null) bestRunTier = parseInt(savedRun, 10) || 0;

function updateBestTag() {
  const el = document.getElementById('besttag');

    ? 'BEST ' + bestScore + '   FURTHEST: RUN ' + (bestRunTier + 1)
    : '';
}
updateBestTag();

function recordRunResult() {
  let changed = false;
  if (score > bestScore) { bestScore = score; changed = true; }
  if (runTier > bestRunTier) { bestRunTier = runTier; changed = true; }
  if (changed) {
    try {
      localStorage.setItem('vortex-best-score', String(bestScore));
      localStorage.setItem('vortex-best-run', String(bestRunTier));
    } catch (err) { /* ignore */ }
    updateBestTag();
  }
}

// ---------- Screen shake (impact juice on hits/damage/boss kills) ----------
let shakeTimer = 0;
let shakeMag = 0;
function triggerShake(magnitude, duration) {
  shakeMag = Math.max(shakeMag, magnitude);
  shakeTimer = Math.max(shakeTimer, duration);
}

// ---------- Game Flow ----------
// continuing = true means this run follows a win (New-Game-Plus escalation
// stays/steps up); false means a fresh start or a retry after a loss, which
// drops the escalation back to the base difficulty.
function startGame(continuing) {
  runTier = continuing ? runTier + 1 : 0;
  score = 0;
  killCount = 0;
  nextMinibossIndex = 0;
  hull = HULL_MAX;
  damageFlash = 0;
  currentLevel = 1;
  bossActive = false;
  boss = null;
  tunnelSidesTarget = computeShapeStage();
  tunnelSides = tunnelSidesTarget;
  document.getElementById('score').textContent = score;
  document.getElementById('kills').textContent = killCount;
  document.getElementById('killTarget').textContent = KILL_TARGET;
  document.getElementById('levelnum').textContent = currentLevel;
  tripleLaserTimer = 0;
  updateHullUI();
  updateBossUI();
  updateRunUI();
  updateTripleUI();
  bolts = [];
  enemies = [];
  enemyBolts = [];
  powerups = [];
  particles = [];
  swellRings = [];
  bitBursts = [];
  hitLabels = [];
  pulses = [];
  spawnTimer = 0;
  clusterTimer = 8 + Math.random() * 6;
  formationTimer = 14 + Math.random() * 6;
  powerupTimer = 10 + Math.random() * 6;
  difficulty = 1;
  state = 'playing';
  document.getElementById('title').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('cleared').style.display = 'none';
  showLevelBanner(runTier > 0 ? 'RUN ' + (runTier + 1) : 'LEVEL 1');
  setMusicTrack('destruction');
}

function updateRunUI() {
  const el = document.getElementById('hudrun');
  if (runTier > 0) {
    el.textContent = 'RUN ' + (runTier + 1);
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function endGame() {
  state = 'gameover';
  recordRunResult();
  document.getElementById('finalscore').textContent = 'SCORE: ' + score + '   ENEMIES: ' + killCount + '/' + KILL_TARGET;
  document.getElementById('gameover').style.display = 'block';
  setMusicTrack('garden');
}

function winGame() {
  state = 'cleared';
  recordRunResult();
  document.getElementById('clearedscore').textContent = 'SCORE: ' + score + '   NEXT: RUN ' + (runTier + 2) + ' (HARDER)';
  document.getElementById('cleared').style.display = 'block';
  setMusicTrack('garden');
}

// ---------- Update ----------
let lastTime = performance.now();

function pickEnemyType() {
  const roll = Math.random();
  if (currentLevel === 1) return 'drone';
  if (currentLevel === 2) return roll < 0.65 ? 'drone' : 'weaver';
  // level 3+: the galaxy's getting pulled apart out here, and something
  // hellish is riding the current in with everything else
  if (roll < 0.42) return 'drone';
  if (roll < 0.68) return 'weaver';
  if (roll < 0.88) return 'shooter';
  return 'pentagram';
}

function spawnEnemy(angleOverride, typeOverride) {
  const params = getDiffParams();
  const type = typeOverride || pickEnemyType();
  const angle = angleOverride !== undefined ? angleOverride : Math.random() * Math.PI * 2;
  const droneShapes = ['tri', 'hex', 'ring'];
  const shape = type === 'shooter' ? 'square' : type === 'weaver' ? 'chevron'
    : type === 'pentagram' ? 'pentagram'
    : droneShapes[Math.floor(Math.random() * droneShapes.length)];
  // shooters hang back and fire instead; pentagrams are slow, deliberate, unstoppable-feeling
  const speedMul = type === 'shooter' ? 0.65 : type === 'pentagram' ? 0.8 : 1;
  const e = {
    angle, z: 1.0, shape, type, alive: true,
    baseAngle: angle, phase: Math.random() * Math.PI * 2,
    speed: (params.speedBase + Math.random() * params.speedVar * difficulty) * speedMul
  };
  if (type === 'shooter') e.fireTimer = 1.6 + Math.random() * 1.4;
  if (type === 'pentagram') e.hp = 2; // takes two hits, a real threat to clear
  enemies.push(e);
}

function spawnCluster() {
  const center = Math.random() * Math.PI * 2;
  for (const off of [-0.3, 0, 0.3]) spawnEnemy(center + off, 'drone');
}

// Classic Space-Invaders-style grid wave: a block of enemies that holds
// formation and sways side to side together as it marches inward.
function spawnFormation() {
  const params = getDiffParams();
  const center = Math.random() * Math.PI * 2;
  const formSeed = Math.random() * Math.PI * 2;
  const speed = params.speedBase * 0.8 + Math.random() * params.speedVar * difficulty * 0.4;
  const cols = 3, rows = 2;
  const colSpacing = 0.26, rowSpacing = 0.09;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const baseAngle = normalizeAngle(center + (c - (cols - 1) / 2) * colSpacing);
      enemies.push({
        angle: baseAngle, z: 1.0 + r * rowSpacing, shape: 'invader', type: 'grid',
        alive: true, baseAngle, phase: 0, formSeed, speed
      });
    }
  }
}

// How long a star pickup's triple-laser spread lasts.
const TRIPLE_LASER_DURATION = 9;

function spawnPowerup() {
  const angle = Math.random() * Math.PI * 2;
  // the star is the rarer, sporadic one — a Mario-style power moment
  const kind = Math.random() < 0.78 ? 'hull' : 'star';
  powerups.push({ angle, z: 1.0, alive: true, kind });
}

function collectPowerup(p) {
  p.alive = false;
  playPowerUp();
  if (p.kind === 'star') {
    tripleLaserTimer = TRIPLE_LASER_DURATION;
    updateTripleUI();
    burst(p.angle, p.z, {
      color: '255,255,255',
      bitColor: '#ffffff',
      label: 'TRIPLE LASER!',
      labelColor: '#fff6c8'
    });
  } else {
    hull = Math.min(HULL_MAX, hull + HULL_REPAIR_PER_POWERUP);
    updateHullUI();
    burst(p.angle, p.z, {
      color: '255,210,63',
      bitColor: '#ffd23f',
      label: '+HULL',
      labelColor: '#ffd23f'
    });
  }
}

function updateTripleUI() {
  const el = document.getElementById('hudtriple');
  if (tripleLaserTimer > 0) {
    el.textContent = 'TRIPLE LASER ' + tripleLaserTimer.toFixed(1) + 's';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function update(dt) {
  t += dt;
  updateMusicMood(dt);

  // camera bank, from how fast the path is sliding sideways right now
  const velX = (pathX(t + 0.05) - pathX(t - 0.05)) / 0.1;
  const targetRoll = Math.max(-0.5, Math.min(0.5, -velX * 0.0022));
  camRoll += (targetRoll - camRoll) * Math.min(1, dt * 4);

  // tunnel cross-section slowly morphs toward whatever shape the current
  // level/run calls for, rather than snapping
  tunnelSides += (tunnelSidesTarget - tunnelSides) * Math.min(1, dt * 0.6);

  // level banner fades on its own timer regardless of what else is happening
  if (levelBannerTimer > 0) {
    levelBannerTimer -= dt;
    if (levelBannerTimer <= 0) document.getElementById('levelbanner').style.opacity = '0';
  }

  if (state === 'playing') {
    // difficulty ramps over time, plus a step up each level
    const diffParams = getDiffParams();
    difficulty = 1 + t * diffParams.rampRate + (currentLevel - 1) * 0.25;

    const pullFactor = 1 + (effectiveTunnelSpeed() / TUNNEL_SPEED - 1) * 0.4;

    if (!bossActive) {
      // spawn enemies, starting easy and loosening up gradually
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(diffParams.spawnMin, diffParams.spawnBase - t * diffParams.spawnDecay);
      }

      // clusters of enemies, once the run has eased the player in
      if (currentLevel >= 2) {
        clusterTimer -= dt;
        if (clusterTimer <= 0) {
          spawnCluster();
          clusterTimer = 9 + Math.random() * 7;
        }
      }

      // classic grid-formation wave, marching side to side as one block
      formationTimer -= dt;
      if (formationTimer <= 0) {
        spawnFormation();
        formationTimer = 18 + Math.random() * 10;
      }
    }

    // power-ups keep spawning through the boss fight too, faster and more
    // often while it's going on since the boss hits hard
    powerupTimer -= dt;
    if (powerupTimer <= 0) {
      spawnPowerup();
      powerupTimer = bossActive ? (6 + Math.random() * 5) : (14 + Math.random() * 10);
    }

    // move enemies toward player (z -> 0), pulled in a little faster as the vortex accelerates
    for (const e of enemies) {
      e.z -= e.speed * pullFactor * dt;
      if (e.type === 'weaver') {
        e.angle = normalizeAngle(e.baseAngle + Math.sin(t * 2.0 + e.phase) * 0.45);
      }
      if (e.type === 'grid') {
        // shared seed + current time means every member of a formation
        // sways in lockstep, keeping its spacing from the rest of the block
        e.angle = normalizeAngle(e.baseAngle + Math.sin(t * 1.1 + e.formSeed) * 0.5);
      }
      if (e.type === 'shooter' && e.alive) {
        e.fireTimer -= dt;
        if (e.fireTimer <= 0 && e.z > 0.12 && e.z < 0.92) {
          enemyBolts.push({ angle: e.angle, z: e.z });
          e.fireTimer = 1.9 + Math.random() * 1.3;
          playEnemyShot();
        }
      }
    }
    for (const p of powerups) {
      p.z -= 0.055 * pullFactor * dt;
    }
    for (const eb of enemyBolts) {
      eb.z -= 0.4 * pullFactor * dt;
    }

    // enemy reaches the ship: damage the hull instead of instant death
    for (const e of enemies) {
      if (e.alive && e.z <= 0.03) {
        e.alive = false;
        damageShip(HULL_DAMAGE_PER_HIT);
      }
    }
    enemies = enemies.filter(e => e.alive);

    // enemy bolt reaches the ship
    for (const eb of enemyBolts) {
      if (eb.z <= 0.03) {
        eb.z = -1; // mark for removal
        damageShip(10);
      }
    }
    enemyBolts = enemyBolts.filter(eb => eb.z > -0.5 && eb.z < 1.1);

    // power-up drifts into the ship: auto-collect, no penalty for missing one
    for (const p of powerups) {
      if (p.alive && p.z <= 0.04) {
        collectPowerup(p);
      }
    }
    powerups = powerups.filter(p => p.alive);

    // boss: moves in slowly, fires volleys, bounces back on contact instead
    // of ending the fight outright
    if (boss && boss.alive) {
      boss.z -= 0.025 * dt;
      boss.fireTimer -= dt;
      if (boss.fireTimer <= 0 && boss.z < 0.9) {
        for (const off of [-0.22, 0, 0.22]) {
          enemyBolts.push({ angle: boss.angle + off, z: boss.z });
        }
        boss.fireTimer = 1.6 + Math.random() * 0.8;
        playEnemyShot();
      }
      if (boss.z <= 0.12) {
        boss.z = BOSS_RESET_Z;
        damageShip(BOSS_CONTACT_DAMAGE);
      }
    }

    // damage flash fades quickly
    damageFlash = Math.max(0, damageFlash - dt * 3.2);
    document.getElementById('damageflash').style.opacity = (damageFlash * 0.6).toFixed(2);

    // screen shake decays to nothing over `shakeTimer` seconds
    if (shakeTimer > 0) {
      shakeTimer = Math.max(0, shakeTimer - dt);
      if (shakeTimer <= 0) shakeMag = 0;
    }

    // triple-laser pickup counts down to nothing
    if (tripleLaserTimer > 0) {
      tripleLaserTimer = Math.max(0, tripleLaserTimer - dt);
      updateTripleUI();
    }

    // move bolts outward
    for (const b of bolts) {
      b.z += 0.9 * dt;
    }
    bolts = bolts.filter(b => b.z < 1.1);

    // bolt-enemy collision (angle proximity + z proximity). Most enemies die
    // in one hit; a pentagram has hp and needs a second to actually go down.
    for (const b of bolts) {
      for (const e of enemies) {
        if (!e.alive) continue;
        let da = Math.abs(normalizeAngle(b.angle - e.angle));
        if (da < 0.4 && Math.abs(b.z - e.z) < 0.14) {
          b.z = 2; // remove
          if (e.hp) {
            e.hp -= 1;
            if (e.hp > 0) {
              playBossHit();
              burst(e.angle, e.z, { color: '255,30,60', bitColor: '#ff1e3c', label: 'HIT!', labelColor: '#ff6680' });
              continue;
            }
          }
          e.alive = false;
          score += e.type === 'pentagram' ? 30 : 10;
          killCount += 1;
          document.getElementById('score').textContent = score;
          document.getElementById('kills').textContent = killCount;
          playHit();
          triggerShake(e.type === 'pentagram' ? 6 : 3, 0.12);
          burst(e.angle, e.z, e.type === 'pentagram' ? { color: '255,30,60', bitColor: '#ff1e3c', label: 'BANISHED!', labelColor: '#ff6680' } : undefined);
        }
      }
    }
    enemies = enemies.filter(e => e.alive);

    // bolt-powerup collision: shoot one early to grab it right away
    for (const b of bolts) {
      for (const p of powerups) {
        if (!p.alive) continue;
        let da = Math.abs(normalizeAngle(b.angle - p.angle));
        if (da < 0.4 && Math.abs(b.z - p.z) < 0.14) {
          b.z = 2; // remove
          collectPowerup(p);
        }
      }
    }
    powerups = powerups.filter(p => p.alive);

    // bolt vs enemy bolt: shoot down an incoming shot before it lands
    for (const b of bolts) {
      for (const eb of enemyBolts) {
        if (eb.z < -0.4) continue;
        let da = Math.abs(normalizeAngle(b.angle - eb.angle));
        if (da < 0.35 && Math.abs(b.z - eb.z) < 0.12) {
          b.z = 2;
          eb.z = -1;
        }
      }
    }
    enemyBolts = enemyBolts.filter(eb => eb.z > -0.5 && eb.z < 1.1);

    // bolt-boss collision: takes several hits to bring down. Several bolts
    // can land in the same frame, so stop the moment the boss goes down
    // instead of letting the next bolt check against a now-null boss.
    if (boss && boss.alive) {
      for (const b of bolts) {
        if (!boss) break;
        let da = Math.abs(normalizeAngle(b.angle - boss.angle));
        if (da < 0.5 && Math.abs(b.z - boss.z) < 0.16) {
          b.z = 2;
          boss.hp -= 1;
          playBossHit();
          triggerShake(10, 0.15);
          burst(boss.angle, boss.z, { color: '255,85,51', bitColor: '#ff5533', label: 'HIT!', labelColor: '#ff8866' });
          updateBossUI();
          if (boss.hp <= 0) {
            const wasMini = boss.kind === 'mini';
            triggerShake(wasMini ? 16 : 26, wasMini ? 0.3 : 0.5);
            boss.alive = false;
            bossActive = false;
            boss = null;
            updateBossUI();
            if (wasMini) {
              // a miniboss is a side fight: beating it doesn't advance the
              // level or reset progress, play just resumes.
              showLevelBanner('CLEAR');
            } else if (currentLevel < LEVEL_COUNT) {
              // beating a level's real boss is what actually advances the
              // level; each level's kill count (and miniboss schedule)
              // starts over fresh.
              currentLevel += 1;
              killCount = 0;
              nextMinibossIndex = 0;
              document.getElementById('kills').textContent = killCount;
              document.getElementById('levelnum').textContent = currentLevel;
              tunnelSidesTarget = computeShapeStage();
              showLevelBanner('LEVEL ' + currentLevel);
            } else {
              winGame();
            }
            break;
          }
        }
      }
    }

    // each level has its own 0..KILL_TARGET kill count. Two non-gating
    // miniboss detours punctuate the way there; the level's real boss only
    // arms once that level's full kill count is reached.
    if (!bossActive && !boss) {
      if (nextMinibossIndex < MINIBOSS_THRESHOLDS.length && killCount >= MINIBOSS_THRESHOLDS[nextMinibossIndex]) {
        nextMinibossIndex += 1;
        showLevelBanner('INCOMING');
        spawnBoss('mini');
      } else if (killCount >= KILL_TARGET) {
        enemies = [];
        showLevelBanner(currentLevel < LEVEL_COUNT ? 'WARNING' : 'FINAL WARNING');
        spawnBoss(currentLevel < LEVEL_COUNT ? 'level' : 'final');
      }
    }

    // particles
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      // air drag so sparks burst fast then hang, instead of flying off linearly
      const drag = Math.pow(0.08, dt);
      p.vx *= drag;
      p.vy *= drag;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    swellRings = swellRings.filter(br => t - br.startTime < 1 / SWELL_RING_SPEED);

    // flickering bit scatter
    for (const bb of bitBursts) {
      bb.x += bb.vx * dt;
      bb.y += bb.vy * dt;
      bb.vx *= 0.92;
      bb.vy *= 0.92;
      bb.life -= dt;
    }
    bitBursts = bitBursts.filter(bb => bb.life > 0);

    // "HIT!" labels float up and fade
    for (const hl of hitLabels) {
      hl.y += hl.vy * dt;
      hl.vy *= 0.9;
      hl.life -= dt;
    }
    hitLabels = hitLabels.filter(hl => hl.life > 0);

    // pulses fade out after ~0.6s
    pulses = pulses.filter(p => t - p.startTime < 0.6);
  }
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

function burst(angle, z, opts) {
  const color = (opts && opts.color) || '180,100,255';
  const bitColor = (opts && opts.bitColor) || '#3f6';
  const label = (opts && opts.label) || 'HIT!';
  const labelColor = (opts && opts.labelColor) || '#fff';

  const pt = pointOnRing(angle, z);
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const speed = 120 + Math.random() * 260;
    particles.push({
      x: pt.x, y: pt.y,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      life: 0.4 + Math.random() * 0.3,
      color
    });
  }

  // scatter of flickering 0/1 bits
  for (let i = 0; i < 7; i++) {
    const ang = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 100;
    const life = 0.45 + Math.random() * 0.45;
    bitBursts.push({
      x: pt.x, y: pt.y,
      vx: Math.cos(ang) * speed,
      vy: Math.sin(ang) * speed,
      life, maxLife: life,
      char: Math.random() < 0.5 ? '0' : '1',
      color: bitColor
    });
  }

  // callout text
  hitLabels.push({ x: pt.x, y: pt.y, vy: -34, life: 0.55, maxLife: 0.55, text: label, color: labelColor });
}

// ---------- Draw ----------
function pulseBrightness(angle, z) {
  let b = 0;
  for (const p of pulses) {
    const age = t - p.startTime;
    const pulseZ = age * 1.8; // how far the pulse ring has traveled outward
    const distZ = Math.abs(z - pulseZ);
    const da = Math.abs(normalizeAngle(angle - p.angle));
    const angularFalloff = Math.max(0, 1 - da / 1.2);
    const zFalloff = Math.max(0, 1 - distZ / 0.15);
    const fade = Math.max(0, 1 - age / 0.6);
    b = Math.max(b, angularFalloff * zFalloff * fade);
  }
  return b;
}

function draw() {
  // background breathes between deep purple and true black, clearly visible
  const cycle = (Math.sin(t * 0.35) + 1) / 2; // 0..1, ~18s period
  // the music's swell deepens the tint on top of the slow breathing cycle
  const r = Math.floor(40 * cycle + 30 * musicSwell);
  const g = 0;
  const b = Math.floor(60 * cycle + 55 * musicSwell);
  ctx.fillStyle = `rgba(${r},${g},${b},0.5)`;
  ctx.fillRect(0, 0, W, H);

  if (state === 'playing' || state === 'gameover' || state === 'cleared') {
    // bank the whole scene with the camera's lateral motion, like a cockpit
    // rolling through a turn, then restore so HUD/reticle math stays simple
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(camRoll);
    ctx.translate(-CX, -CY);
    // impact shake: a small random jitter that decays with shakeTimer, so
    // hits/boss-kills read as physical punches rather than silent hp loss
    if (shakeTimer > 0 && shakeMag > 0) {
      const falloff = shakeTimer; // fades out as the timer runs down
      ctx.translate((Math.random() - 0.5) * shakeMag * falloff, (Math.random() - 0.5) * shakeMag * falloff);
    }
    drawTunnel();
    drawEnemies();
    drawBoss();
    drawPowerups();
    drawBolts();
    drawEnemyBolts();
    drawParticles();
    drawBitBursts();
    drawHitLabels();
    drawAimLine();
    drawShip();
    ctx.restore();
  }
}

function drawTunnel() {
  // radial spokes, sampled along z so they bend through the camera's turns
  // and twist with the vortex swirl instead of staying ruler straight
  const SPOKE_STEPS = 10;
  ctx.strokeStyle = `rgba(60,110,255,${0.18 + 0.22 * musicSwell})`;
  ctx.lineWidth = 1;
  for (let s = 0; s < SIDES; s++) {
    const angle = (s / SIDES) * Math.PI * 2;
    ctx.beginPath();
    for (let k = 0; k <= SPOKE_STEPS; k++) {
      const z = k / SPOKE_STEPS;
      const pt = pointOnRing(angle, z);
      if (k === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
  }

  // concentric rings, scrolling, accelerating toward the event horizon
  const offset = (t * effectiveTunnelSpeed()) % RING_SPACING;
  for (let i = -1; i <= RING_COUNT; i++) {
    let z = i / RING_COUNT + offset;
    if (z > 1 || z < 0) continue;
    ctx.beginPath();
    for (let s = 0; s <= RING_SAMPLES; s++) {
      const angle = (s / RING_SAMPLES) * Math.PI * 2;
      const pt = pointOnRing(angle, z);
      if (s === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    }
    // swell lifts the rings' brightness; shimmer washes them toward cyan-white
    const alpha = 0.12 + 0.25 * (1 - z) + 0.25 * musicSwell * (1 - z);
    const sh = musicShimmer;
    ctx.strokeStyle = `rgba(${Math.round(60 + 120 * sh)},${Math.round(130 + 100 * sh)},255,${Math.min(1, alpha)})`;
    ctx.lineWidth = 1.5 + musicSwell;
    ctx.stroke();
  }

  // swell rings drift in from the event horizon at a pace set by the music,
  // fading in from the dark and out as they reach the player
  if (swellRings.length) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const br of swellRings) {
      const age = t - br.startTime;
      const z = 1 - age * SWELL_RING_SPEED;
      if (z <= 0) continue;
      ctx.beginPath();
      for (let s = 0; s <= RING_SAMPLES; s++) {
        const angle = (s / RING_SAMPLES) * Math.PI * 2;
        const pt = pointOnRing(angle, z);
        if (s === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      const fade = Math.sin(Math.PI * (1 - z)); // 0 at both ends, 1 midway
      ctx.strokeStyle = `rgba(80,230,255,${(0.2 + 0.35 * musicSwell) * fade})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#50e6ff';
      ctx.shadowBlur = 10 + 12 * musicShimmer;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // pulse glow overlay on spokes (sample brightness at a few angles per pulse)
  if (pulses.length) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of pulses) {
      const age = t - p.startTime;
      const z = Math.min(1, age * 1.8);
      const fade = Math.max(0, 1 - age / 0.6);
      if (fade <= 0) continue;
      ctx.beginPath();
      for (let s = 0; s <= RING_SAMPLES; s++) {
        const angle = (s / RING_SAMPLES) * Math.PI * 2;
        const pt2 = pointOnRing(angle, z);
        if (s === 0) ctx.moveTo(pt2.x, pt2.y);
        else ctx.lineTo(pt2.x, pt2.y);
      }
      ctx.strokeStyle = `rgba(255,40,180,${0.6 * fade})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff2db4';
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

const ENEMY_COLORS = {
  drone:     { rgb: '60,255,140', hex: '#3f6' },
  weaver:    { rgb: '255,120,60', hex: '#ff783c' },
  shooter:   { rgb: '60,190,255', hex: '#3cbeff' },
  grid:      { rgb: '220,255,60', hex: '#dcff3c' },
  pentagram: { rgb: '255,20,50',  hex: '#ff1432' }
};

function drawEnemies() {
  for (const e of enemies) {
    const pt = pointOnRing(e.angle, e.z);
    const size = Math.max(3, 18 * (1 - e.z) + 4);
    const bright = pulseBrightness(e.angle, e.z);
    const glow = 10 + bright * 30;
    const col = ENEMY_COLORS[e.type] || ENEMY_COLORS.drone;
    // shooters hold still and aim, grid marchers stay flat and upright like
    // the classics, pentagrams turn slow and deliberate like they're not in
    // any hurry, everyone else tumbles
    const spin = e.type === 'shooter' ? e.angle : e.type === 'grid' ? 0
      : e.type === 'pentagram' ? t * 0.4 + e.angle
      : t * 1.5 + e.angle;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(spin);
    ctx.strokeStyle = bright > 0.1
      ? `rgba(${Math.floor(255 - bright*180)},255,${Math.floor(180 + bright*75)},1)`
      : `rgba(${col.rgb},0.85)`;
    ctx.shadowColor = bright > 0.1 ? '#fff' : col.hex;
    ctx.shadowBlur = glow;
    ctx.lineWidth = 2;

    ctx.beginPath();
    if (e.shape === 'tri') {
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2;
        const x = Math.cos(a) * size, y = Math.sin(a) * size;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    } else if (e.shape === 'hex') {
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const x = Math.cos(a) * size, y = Math.sin(a) * size;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    } else if (e.shape === 'square') {
      ctx.rect(-size * 0.8, -size * 0.8, size * 1.6, size * 1.6);
    } else if (e.shape === 'invader') {
      // blocky, stepped-edge silhouette — a throwback to the classic marching grid
      const ip = [
        [-0.3, -1], [0.3, -1], [0.3, -0.6], [0.6, -0.6], [0.6, -0.2], [1, -0.2], [1, 0.2],
        [0.6, 0.2], [0.6, 0.6], [0.3, 0.6], [0.3, 1], [-0.3, 1], [-0.3, 0.6], [-0.6, 0.6],
        [-0.6, 0.2], [-1, 0.2], [-1, -0.2], [-0.6, -0.2], [-0.6, -0.6], [-0.3, -0.6]
      ];
      ip.forEach(([x, y], i) => {
        const px = x * size * 0.75, py = y * size * 0.75;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.closePath();
    } else if (e.shape === 'chevron') {
      // arrow-like fighter silhouette for the weaving enemy
      ctx.moveTo(0, -size * 1.2);
      ctx.lineTo(size * 0.7, size * 0.7);
      ctx.lineTo(0, size * 0.15);
      ctx.lineTo(-size * 0.7, size * 0.7);
      ctx.closePath();
    } else if (e.shape === 'pentagram') {
      // inverted five-pointed star — something hellish riding the current in
      const outerR = size * 1.15, innerR = size * 0.44;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 + Math.PI; // point-down
        const rr = i % 2 === 0 ? outerR : innerR;
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    } else {
      ctx.arc(0, 0, size, 0, Math.PI * 2);
    }
    ctx.stroke();
    if (e.shape === 'pentagram') {
      // the ritual-circle ring that reads as "occult emblem" rather than
      // just a star outline
      ctx.beginPath();
      ctx.arc(0, 0, size * 1.45, 0, Math.PI * 2);
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1.25;
      ctx.stroke();
      ctx.globalAlpha = 1;
      // second hit left it cracked/bleeding out instead of unharmed-looking
      if (e.hp === 1) {
        ctx.beginPath();
        ctx.moveTo(-size * 0.3, -size * 0.2);
        ctx.lineTo(size * 0.2, size * 0.5);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawEnemyBolts() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const eb of enemyBolts) {
    if (eb.z < -0.4 || eb.z > 1.1) continue;
    const p1 = pointOnRing(eb.angle, Math.min(1, eb.z + 0.04));
    const p2 = pointOnRing(eb.angle, Math.max(0, eb.z - 0.015));
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = '#3cbeff';
    ctx.shadowColor = '#3cbeff';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawBoss() {
  if (!boss || !boss.alive) return;
  const pt = pointOnRing(boss.angle, boss.z);
  const size = Math.max(10, 50 * (1 - boss.z) + 14);
  ctx.save();
  ctx.translate(pt.x, pt.y);
  ctx.rotate(t * 0.3);
  ctx.strokeStyle = '#ff5533';
  ctx.shadowColor = '#ff5533';
  ctx.shadowBlur = 24 + Math.sin(t * 4) * 6;
  ctx.lineWidth = 3;
  // large faceted hull, same gem-cut language as the player ship but bigger and hostile
  const pts = [];
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const r = size * (i % 2 === 0 ? 1 : 0.72);
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
  ctx.closePath();
  ctx.stroke();
  // inner facet lines
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.6;
  for (let i = 0; i < pts.length; i += 2) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPowerups() {
  for (const p of powerups) {
    const pt = pointOnRing(p.angle, p.z);
    const size = Math.max(4, 17 * (1 - p.z) + 5);
    ctx.save();
    ctx.translate(pt.x, pt.y);
    if (p.kind === 'star') {
      // a Mario-star-like pickup: spins faster, flickers white/gold, unmissable
      ctx.rotate(t * 2.4);
      const flicker = Math.sin(t * 14) > 0;
      ctx.strokeStyle = flicker ? '#ffffff' : '#ffd23f';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 20 + Math.sin(t * 10) * 8;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const outerR = size * 1.1, innerR = size * 0.44;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const rr = i % 2 === 0 ? outerR : innerR;
        const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    } else {
      ctx.rotate(t * 0.9);
      ctx.strokeStyle = '#ffd23f';
      ctx.shadowColor = '#ffd23f';
      ctx.shadowBlur = 16 + Math.sin(t * 6) * 4;
      ctx.lineWidth = 2;
      // outlined triangle
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 - Math.PI / 2;
        const x = Math.cos(a) * size, y = Math.sin(a) * size;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
      // plus sign: reads as a repair pickup
      ctx.beginPath();
      ctx.moveTo(-size * 0.32, 0.08 * size);
      ctx.lineTo(size * 0.32, 0.08 * size);
      ctx.moveTo(0, -size * 0.22);
      ctx.lineTo(0, size * 0.38);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawShip() {
  // a blocky, low-poly faceted hull (gem-like, not a dart): wide body with
  // visible internal facet lines, short stub fins ending in thruster pods
  const sx = CX;
  const sy = H - Math.min(W, H) * 0.11;
  const s = Math.min(W, H) * 0.095;
  const lean = Math.max(-0.22, Math.min(0.22, Math.sin(aimAngle) * 0.18));

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(lean);
  ctx.scale(1, 0.82); // looking slightly down onto the hull

  const P = (x, y) => [x * s, y * s];
  function strokeShape(pts, close) {
    ctx.beginPath();
    pts.forEach((pt, i) => {
      const [x, y] = P(pt[0], pt[1]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if (close) ctx.closePath();
    ctx.stroke();
  }
  function strokeLine(a, b) {
    ctx.beginPath();
    ctx.moveTo(...P(a[0], a[1]));
    ctx.lineTo(...P(b[0], b[1]));
    ctx.stroke();
  }

  // blocky gem-cut hull: wide octagonal silhouette, not a tapered dart
  const top = [0, -0.95], shR = [0.55, -0.5], midR = [0.78, 0.05],
        loR = [0.42, 0.6], bot = [0, 0.82], loL = [-0.42, 0.6],
        midL = [-0.78, 0.05], shL = [-0.55, -0.5];

  // ship accent color is player-chosen on the title screen (SHIP_PALETTES)
  const pal = SHIP_PALETTES[shipPaletteIndex];

  ctx.strokeStyle = pal.main;
  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 16;
  ctx.lineWidth = 2.2;
  strokeShape([top, shR, midR, loR, bot, loL, midL, shL], true);

  // internal facet lines, low-poly cut lines across the hull
  ctx.lineWidth = 1;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = hexToRgba(pal.main, 0.5);
  strokeLine(top, midR);
  strokeLine(top, midL);
  strokeLine(bot, midR);
  strokeLine(bot, midL);
  strokeLine(midL, midR);
  strokeLine(shR, loR);
  strokeLine(shL, loL);

  // short stub fins from the hull's waist, ending in small thruster pods
  ctx.strokeStyle = hexToRgba(pal.main, 0.8);
  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 10;
  ctx.lineWidth = 1.6;
  strokeLine(midR, [1.25, 0.12]);
  strokeLine(midL, [-1.25, 0.12]);
  // pods (small rectangles with grille stripes, like the reference ships)
  for (const side of [1, -1]) {
    const x0 = side * 1.05, x1 = side * 1.5;
    strokeShape([[x0, -0.08], [x1, -0.08], [x1, 0.3], [x0, 0.3]], true);
    ctx.lineWidth = 0.8;
    for (const f of [0.05, 0.15, 0.25]) {
      strokeLine([x0, -0.08 + f * 0.9], [x1, -0.08 + f * 0.9]);
    }
    ctx.lineWidth = 1.6;
  }
  // bright engine core glow at the back of each pod
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10;
  for (const side of [1, -1]) {
    const [ex, ey] = P(side * 1.5, 0.11);
    ctx.beginPath();
    ctx.arc(ex, ey, 0.04 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  // valknut emblem on the forward facet of the hull
  ctx.strokeStyle = pal.glow;
  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 8;
  ctx.lineWidth = 1;
  const knotR = 0.15, knotY = -0.15;
  for (let k = 0; k < 3; k++) {
    const rot = (k / 3) * Math.PI * 2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = rot + (i / 3) * Math.PI * 2 - Math.PI / 2;
      const [x, y] = P(Math.cos(a) * knotR, knotY + Math.sin(a) * knotR);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  ctx.restore();
}

function drawBolts() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bolts) {
    const p1 = pointOnRing(b.angle, Math.max(0, b.z - 0.05));
    const p2 = pointOnRing(b.angle, Math.min(1, b.z + 0.02));
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = '#a855ff';
    ctx.shadowColor = '#a855ff';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of particles) {
    // streak back along the velocity: long while fast, shrinking to a dot
    const a = Math.max(0, Math.min(1, p.life * 1.6));
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05);
    ctx.strokeStyle = `rgba(${p.color || '180,100,255'},${a})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawBitBursts() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.font = "bold 13px 'Press Start 2P', 'Courier New', monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const bb of bitBursts) {
    // genuinely random flicker: skip some frames entirely for a glitchy feel
    if (Math.random() < 0.25) continue;
    const fade = Math.max(0, bb.life / bb.maxLife);
    ctx.globalAlpha = fade;
    ctx.fillStyle = bb.color || '#3f6';
    ctx.shadowColor = bb.color || '#3f6';
    ctx.shadowBlur = Math.random() < 0.5 ? 10 : 2;
    ctx.fillText(bb.char, bb.x, bb.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawHitLabels() {
  ctx.save();
  ctx.font = "10px 'Press Start 2P', 'Courier New', monospace";
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const hl of hitLabels) {
    const fade = Math.max(0, hl.life / hl.maxLife);
    ctx.globalAlpha = fade;
    ctx.fillStyle = hl.color || '#fff';
    ctx.shadowColor = hl.color || '#fff';
    ctx.shadowBlur = 8;
    ctx.fillText(hl.text || 'HIT!', hl.x, hl.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawAimLine() {
  // kept straight and unswirled: this is the player's own fixed reticle, not world geometry
  const outer = pointOnRing(aimAngle, 0.0, { visual: false });
  const inner = pointOnRing(aimAngle, 0.12, { visual: false });
  ctx.beginPath();
  ctx.moveTo(inner.x, inner.y);
  ctx.lineTo(outer.x, outer.y);
  ctx.strokeStyle = 'rgba(168,85,255,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // reticle
  ctx.beginPath();
  ctx.arc(outer.x, outer.y, 10, 0, Math.PI * 2);
  ctx.strokeStyle = '#a855ff';
  ctx.shadowColor = '#a855ff';
  ctx.shadowBlur = 10;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ---------- Loop ----------
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
